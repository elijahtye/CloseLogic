<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Golden yellow gradient - subtle and flat -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main C letter - thick, rounded edges, opening to the right -->
  <path d="M 20 20 
           C 10 20, 5 25, 5 35
           L 5 85
           C 5 95, 10 100, 20 100
           L 100 100
           C 110 100, 115 95, 115 85
           L 115 35
           C 115 25, 110 20, 100 20
           L 20 20 Z
           
           M 35 30
           L 35 90
           C 35 95, 40 100, 45 100
           L 95 100
           C 100 100, 105 95, 105 90
           L 105 30
           C 105 25, 100 20, 95 20
           L 45 20
           C 40 20, 35 25, 35 30 Z" 
        fill="url(#goldGradient)" 
        fill-rule="evenodd"/>
  
  <!-- House icon inside C - positioned bottom right, slightly off-center -->
  <!-- House base (square) -->
  <rect x="65" y="70" width="18" height="18" 
        fill="url(#goldGradient)"/>
  
  <!-- House roof (triangle) -->
  <path d="M 62 70 
           L 74 60 
           L 86 70 Z" 
        fill="url(#goldGradient)"/>
  
  <!-- Window (square with cross frame - 4 panes) -->
  <rect x="68" y="75" width="12" height="10" 
        fill="none" 
        stroke="#B8860B" 
        stroke-width="1.2"/>
  <!-- Vertical divider -->
  <line x1="74" y1="75" x2="74" y2="85" 
        stroke="#B8860B" 
        stroke-width="1.2"/>
  <!-- Horizontal divider -->
  <line x1="68" y1="80" x2="80" y2="80" 
        stroke="#B8860B" 
        stroke-width="1.2"/>
</svg>
